# Example autostart entries
#monitorrule = DP-1, hottomof, eDP-1
exec-once = rofi -show drun
# Global Inner & Outer Gaps (Set to 0 for a gapless look)
gappih = 0   # Horizontal inner gaps between windows
gappiv = 0   # Vertical inner gaps between windows
gappoh = 0   # Horizontal outer gaps between windows and screen edges
gappov = 0   # Vertical outer gaps between windows and screen edges
# Window Border Configuration
borderpx = 0   # Set to 0 to completely disable borders globally


trackpad_accel_speed=0.5
